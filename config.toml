#:schema https://developers.openai.com/codex/config-schema.json
# ============================================================
# Primary model
# ============================================================

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

# Keep interactive planning on the strong primary model.
plan_mode_reasoning_effort = "high"

# Model used by manual /review.
review_model = "gpt-6.1-sol"
service_tier = "default"

# ============================================================
# Subagents
# ============================================================

[agents]
enabled = true

# Safe fallback for unnamed or generic spawned agents.
# Named custom agents below override these settings.
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

# Prefer serial execution. A second slot exists only for genuinely
# independent investigations or hypotheses.
max_concurrent_threads_per_session = 2


[windows]
sandbox = "elevated"

[features]
js_repl = false

[features.multi_agent_v2]
enabled = true

[desktop]
conversationDetailMode = "STEPS_PROSE"
sansFontSize = 14
codeFontSize = 13
ambient-suggestions-enabled = true
followUpQueueMode = "queue"
